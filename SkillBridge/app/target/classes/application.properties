spring.application.name=SkillBridge

# Overridden by env vars in docker-compose; these are local dev defaults
spring.datasource.url=jdbc:mysql://localhost:3306/skillbridge?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=skillbridge
spring.datasource.password=skillbridge
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false

server.port=8080

# File upload (resumes)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

# Email (interview scheduling notifications).
# If SMTP host is left blank or unreachable, EmailService catches the failure
# and logs the message instead of crashing the request - see EmailService.java.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${SMTP_FROM:SkillBridge <no-reply@skillbridge.dev>}

