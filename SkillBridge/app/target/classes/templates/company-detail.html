<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Company - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width:700px;">
    <a href="/companies" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left"></i> All companies</a>

    <div class="card p-4 mt-2">
        <div class="d-flex justify-content-between">
            <h3 th:text="${company.name}"></h3>
            <span class="badge bg-success" th:if="${company.verified}">Verified</span>
        </div>
        <p class="text-muted" th:text="${company.industry}"></p>
        <p th:text="${company.description}"></p>
        <a th:if="${company.website}" th:href="${company.website}" target="_blank" class="small"><i class="bi bi-box-arrow-up-right"></i> Website</a>
    </div>

    <div class="card p-4 mt-3">
        <h5><i class="bi bi-star-fill text-warning"></i> Anonymous Student Ratings</h5>
        <div th:if="${ratingSummary.totalRatings == 0}" class="text-muted small">No ratings yet.</div>
        <div th:if="${ratingSummary.totalRatings > 0}">
            <div class="row text-center g-2 mb-3">
                <div class="col-4"><strong th:text="${ratingSummary.avgDifficulty} + '/5'"></strong><br><span class="small text-muted">Difficulty</span></div>
                <div class="col-4"><strong th:text="${ratingSummary.avgCommunication} + '/5'"></strong><br><span class="small text-muted">Communication</span></div>
                <div class="col-4"><strong th:text="${ratingSummary.avgProcess} + '/5'"></strong><br><span class="small text-muted">Process</span></div>
            </div>
            <div th:each="c : ${ratingSummary.comments}" class="border-bottom py-2 small">
                <i class="bi bi-quote text-muted"></i> <span th:text="${c}"></span>
            </div>
        </div>
    </div>

    <div class="card p-4 mt-3" th:unless="${alreadyRated}">
        <h5>Rate This Company</h5>
        <p class="small text-muted">Your rating is anonymous — other students and the recruiter will only ever see the average.</p>
        <form th:action="@{/companies/{id}/rate(id=${company.id})}" method="post">
            <div class="mb-2">
                <label class="form-label small">Interview Difficulty (1-5)</label>
                <input type="number" name="difficulty" min="1" max="5" class="form-control" required>
            </div>
            <div class="mb-2">
                <label class="form-label small">Communication (1-5)</label>
                <input type="number" name="communication" min="1" max="5" class="form-control" required>
            </div>
            <div class="mb-2">
                <label class="form-label small">Process Quality (1-5)</label>
                <input type="number" name="process" min="1" max="5" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small">Comment (optional)</label>
                <textarea name="comment" class="form-control" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Submit Rating</button>
        </form>
    </div>
    <div class="alert alert-info mt-3" th:if="${alreadyRated}">You've already rated this company. Thanks!</div>
</div>
</body>
</html>
