<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Placement Statistics - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="sb-section-title">Placement Statistics</h3>
    <p class="sb-section-subtitle">Live figures pulled directly from selected applications.</p>

    <div class="row g-3">
        <div class="col-md-3">
            <div class="card stat-card sb-hover">
                <div class="stat-icon"><i class="bi bi-mortarboard"></i></div>
                <div class="value" th:text="${stats.totalPlacedStudents}"></div>
                <div class="label">Students Placed</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card sb-hover">
                <div class="stat-icon"><i class="bi bi-cash-stack"></i></div>
                <div class="value" th:text="${stats.averagePackage} + ' LPA'"></div>
                <div class="label">Average Package</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card sb-hover">
                <div class="stat-icon"><i class="bi bi-trophy"></i></div>
                <div class="value" th:text="${stats.highestPackage} + ' LPA'"></div>
                <div class="label">Highest Package</div>
            </div>
        </div>
        <div class="col-md-3">
            <a href="/reports" class="text-decoration-none">
                <div class="card stat-card sb-hover">
                    <div class="stat-icon"><i class="bi bi-file-earmark-pdf"></i></div>
                    <div class="value" style="font-size:1.1rem;">Reports</div>
                    <div class="label">Download PDFs</div>
                </div>
            </a>
        </div>
    </div>

    <div class="row g-3 mt-1">
        <div class="col-md-6">
            <div class="card p-3">
                <h6>Offers by Company</h6>
                <canvas id="companyChart" height="200"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-3">
                <h6>Placed Students by Department</h6>
                <canvas id="deptChart" height="200"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const offersByCompany = /*[[${stats.offersByCompany}]]*/ {};
    const placedByDepartment = /*[[${stats.placedByDepartment}]]*/ {};
    /*]]>*/

    function renderBarChart(canvasId, dataObj, color) {
        const keys = Object.keys(dataObj);
        if (keys.length === 0) return;
        new Chart(document.getElementById(canvasId), {
            type: 'bar',
            data: { labels: keys, datasets: [{ data: keys.map(k => dataObj[k]), backgroundColor: color }] },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
        });
    }
    renderBarChart('companyChart', offersByCompany, '#4f46e5');
    renderBarChart('deptChart', placedByDepartment, '#06b6d4');
</script>
</body>
</html>
