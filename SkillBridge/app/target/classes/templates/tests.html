<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aptitude Tests - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h3 class="sb-section-title mb-0">Aptitude Tests</h3>
            <p class="sb-section-subtitle mb-0">Sharpen your skills and benchmark yourself.</p>
        </div>
        <a href="/tests/results" class="btn btn-outline-primary"><i class="bi bi-clipboard-data"></i> My Results</a>
    </div>
    <div class="row g-3 mt-1">
        <div class="col-md-4" th:each="t : ${tests}">
            <div class="card sb-hover p-3">
                <div class="stat-icon mb-2"><i class="bi bi-patch-question"></i></div>
                <h5 th:text="${t.title}"></h5>
                <p class="text-muted small" th:text="${t.description}"></p>
                <p class="small text-muted" th:text="${#lists.size(t.questions)} + ' questions'"></p>
                <a th:href="@{/tests/{id}/take(id=${t.id})}" class="btn btn-sm btn-primary">Start Test</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
