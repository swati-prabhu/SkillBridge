<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Saved Searches - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width:700px;">
    <h3 class="sb-section-title">Saved Search Alerts</h3>
    <p class="sb-section-subtitle">Get notified the moment a new internship matches your saved criteria.</p>

    <div class="card p-3 mb-4">
        <form th:action="@{/saved-searches}" method="post" class="d-flex gap-2 flex-wrap">
            <input type="text" name="keyword" class="form-control" placeholder="Keyword (title/company/location)" style="max-width:280px;">
            <select name="category" class="form-select" style="max-width:200px;">
                <option value="">Any category</option>
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
            </select>
            <button class="btn btn-primary" type="submit"><i class="bi bi-plus-lg"></i> Save Search</button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(savedSearches)}" class="sb-empty">
        <i class="bi bi-bell"></i>
        No saved searches yet.
    </div>

    <div class="card p-3" th:unless="${#lists.isEmpty(savedSearches)}">
        <div th:each="s : ${savedSearches}" class="d-flex justify-content-between align-items-center border-bottom py-2">
            <div>
                <span th:if="${s.keyword != null and !s.keyword.isEmpty()}" class="badge bg-light text-dark border me-1" th:text="'\u201c' + ${s.keyword} + '\u201d'"></span>
                <span th:if="${s.category != null and !s.category.isEmpty()}" class="badge bg-light text-dark border" th:text="${s.category}"></span>
                <span th:if="${(s.keyword == null or s.keyword.isEmpty()) and (s.category == null or s.category.isEmpty())}" class="text-muted small">Any new internship</span>
            </div>
            <form th:action="@{/saved-searches/{id}/delete(id=${s.id})}" method="post">
                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
