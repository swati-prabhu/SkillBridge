<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Skill Gap Analysis - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width:700px;">
    <h3 class="sb-section-title">Skill Gap Analysis</h3>
    <p class="sb-section-subtitle">Pick a target internship and see exactly what's missing from your profile.</p>

    <div class="card p-3 mb-4">
        <form method="get" class="d-flex gap-2">
            <select name="internshipId" class="form-select" required>
                <option value="" disabled th:selected="${target == null}">Choose a target internship</option>
                <option th:each="i : ${internships}" th:value="${i.id}" th:text="${i.title} + ' — ' + ${i.company}" th:selected="${target != null and target.id == i.id}"></option>
            </select>
            <button class="btn btn-primary" type="submit">Analyze</button>
        </form>
    </div>

    <div th:if="${result != null}">
        <div class="card p-4 mb-3 text-center">
            <div style="font-size:2.2rem; font-weight:800;" th:text="${result.matchPercent} + '%'"></div>
            <div class="text-muted small">Skill Match for <span th:text="${target.title}"></span></div>
        </div>

        <div class="card p-3 mb-3">
            <h6 class="text-danger"><i class="bi bi-x-circle"></i> Missing Skills</h6>
            <p th:if="${#lists.isEmpty(result.missingSkills)}" class="text-muted small">None — you're fully covered!</p>
            <span class="badge bg-danger-subtle text-danger me-1 mb-1" th:each="s : ${result.missingSkills}" th:text="${s}"></span>
        </div>

        <div class="card p-3" th:if="${result.suggestedRoadmap != null}">
            <h6><i class="bi bi-map text-primary"></i> Suggested Roadmap</h6>
            <p>Covers the most of your gap: <strong th:text="${result.suggestedRoadmap.title}"></strong></p>
            <a th:href="@{/roadmaps/{id}(id=${result.suggestedRoadmap.id})}" class="btn btn-sm btn-primary">View Roadmap</a>
        </div>
    </div>
</div>
</body>
</html>
