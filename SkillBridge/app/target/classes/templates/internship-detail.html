<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${internship.title}">Internship</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h3 th:text="${internship.title}"></h3>
                <h6 class="text-muted" th:text="${internship.company}"></h6>
            </div>
            <form sec:authorize="hasAuthority('ROLE_STUDENT')" th:action="@{/bookmarks/toggle/{id}(id=${internship.id})}" method="post">
                <button type="submit" class="btn-bookmark" th:classappend="${bookmarked} ? 'active' : ''" title="Save internship">
                    <i th:class="${bookmarked} ? 'bi bi-bookmark-star-fill' : 'bi bi-bookmark'"></i>
                </button>
            </form>
        </div>
        <p class="mt-3" th:text="${internship.description}"></p>
        <ul class="list-unstyled">
            <li class="mb-1"><i class="bi bi-geo-alt text-muted"></i> <strong>Location:</strong> <span th:text="${internship.location}"></span></li>
            <li class="mb-1"><i class="bi bi-cash-coin text-muted"></i> <strong>Stipend:</strong> <span th:text="${internship.stipend}"></span></li>
            <li class="mb-1"><i class="bi bi-clock text-muted"></i> <strong>Duration:</strong> <span th:text="${internship.duration}"></span></li>
            <li class="mb-1"><i class="bi bi-stars text-muted"></i> <strong>Required Skills:</strong> <span th:text="${internship.requiredSkills}"></span></li>
        </ul>

        <div sec:authorize="hasAuthority('ROLE_STUDENT')" class="d-flex gap-2">
            <form th:action="@{/applications/apply/{id}(id=${internship.id})}" method="post">
                <button class="btn btn-primary" type="submit"><i class="bi bi-send"></i> Apply Now</button>
            </form>
            <a th:href="@{/internships/{id}/ats-match(id=${internship.id})}" class="btn btn-outline-primary"><i class="bi bi-graph-up"></i> Check ATS Match</a>
            <a th:href="@{/skill-gap(internshipId=${internship.id})}" class="btn btn-outline-secondary"><i class="bi bi-graph-up-arrow"></i> Skill Gap</a>
        </div>

        <div sec:authorize="hasAuthority('ROLE_ADMIN') or hasAuthority('ROLE_RECRUITER')" class="d-flex gap-2 mt-2">
            <a th:href="@{/internships/{id}/edit(id=${internship.id})}" class="btn btn-outline-secondary"><i class="bi bi-pencil"></i> Edit</a>
            <form th:action="@{/internships/{id}/delete(id=${internship.id})}" method="post">
                <button class="btn btn-outline-danger" type="submit"><i class="bi bi-trash"></i> Delete</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
