<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Audit Log - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="sb-section-title">Audit Log</h3>
    <p class="sb-section-subtitle">Every admin action, in order — who did what, and when.</p>

    <div th:if="${#lists.isEmpty(logs)}" class="sb-empty">
        <i class="bi bi-list-check"></i>
        No actions logged yet.
    </div>

    <div class="card p-3" th:unless="${#lists.isEmpty(logs)}">
        <table class="table align-middle mb-0">
            <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead>
            <tbody>
            <tr th:each="log : ${logs}">
                <td class="small text-muted" th:text="${#temporals.format(log.createdAt, 'dd MMM yyyy, hh:mm a')}"></td>
                <td th:text="${log.actor.fullName}"></td>
                <td><span class="badge bg-light text-dark border" th:text="${log.action}"></span></td>
                <td th:text="${log.entity} + (${log.entityId} != null ? ' #' + ${log.entityId} : '')"></td>
                <td class="small text-muted" th:text="${log.details}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${totalPages > 1}" class="d-flex justify-content-center gap-2 mt-4">
        <a th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/admin/audit-log(page=${p})}"
           class="btn btn-sm"
           th:classappend="${p == currentPage} ? 'btn-primary' : 'btn-outline-primary'"
           th:text="${p + 1}"></a>
    </div>
</div>
</body>
</html>
