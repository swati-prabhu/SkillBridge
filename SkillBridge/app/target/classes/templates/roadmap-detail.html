<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${roadmap.title}">Roadmap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <a href="/roadmaps" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left"></i> All roadmaps</a>

    <div class="d-flex align-items-center gap-3 mt-2 mb-2">
        <div class="roadmap-icon" style="width:64px;height:64px;font-size:1.8rem;"><i th:class="'bi ' + ${roadmap.icon}"></i></div>
        <div>
            <h3 class="mb-0" th:text="${roadmap.title}"></h3>
            <p class="text-muted mb-0" th:text="${roadmap.description}"></p>
        </div>
    </div>

    <div class="card p-3 mb-4">
        <div class="d-flex justify-content-between mb-1">
            <span class="fw-semibold">Your progress</span>
            <span class="fw-semibold" th:text="${percent} + '%'"></span>
        </div>
        <div class="roadmap-progress">
            <div class="roadmap-progress-bar" th:style="'width:' + ${percent} + '%'"></div>
        </div>
    </div>

    <div th:each="step, iter : ${roadmap.steps}"
         class="step-item"
         th:classappend="${completion.get(step.id)} ? 'completed' : ''">
        <form th:action="@{/roadmaps/steps/{id}/toggle(id=${step.id})}" method="post">
            <input type="hidden" name="roadmapId" th:value="${roadmap.id}">
            <button type="submit" class="step-check" title="Mark complete">
                <i class="bi bi-check-lg" th:if="${completion.get(step.id)}"></i>
            </button>
        </form>
        <div>
            <div class="step-title fw-semibold" th:text="(${iter.index} + 1) + '. ' + ${step.title}"></div>
            <div class="text-muted small" th:text="${step.description}"></div>
            <a th:if="${step.resourceLink != null and !step.resourceLink.isEmpty()}"
               th:href="${step.resourceLink}" target="_blank" class="small">
                <i class="bi bi-box-arrow-up-right"></i> Resource
            </a>
        </div>
    </div>
</div>
</body>
</html>
