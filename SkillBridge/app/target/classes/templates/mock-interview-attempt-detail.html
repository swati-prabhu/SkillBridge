<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Attempt Detail - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width:700px;">
    <a href="/mock-interviews/attempts" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left"></i> My attempts</a>
    <h3 class="sb-section-title mt-2" th:text="${attempt.mockInterview.title}"></h3>

    <div class="card p-3 mb-3">
        <div class="d-flex justify-content-between align-items-center">
            <span class="fw-semibold">Overall Score</span>
            <span class="fw-bold" th:text="(${attempt.overallScore} ?: 0) + '%'"></span>
        </div>
        <p class="small text-muted mt-2 mb-0" th:text="${attempt.overallFeedback}"></p>
        <span class="badge mt-2 align-self-start" th:classappend="${attempt.reviewed} ? 'bg-success' : 'bg-warning text-dark'"
              th:text="${attempt.reviewed} ? 'Admin Reviewed' : 'Preliminary (auto-generated)'"></span>
    </div>

    <div class="card p-3 mb-2" th:each="r, iter : ${attempt.responses}">
        <p class="fw-semibold small" th:text="(${iter.index} + 1) + '. ' + ${r.question.questionText}"></p>
        <p class="mb-0" th:text="${r.answerText}"></p>
    </div>

    <a th:href="@{/certificates/mock-interview/{id}(id=${attempt.id})}" class="btn btn-outline-success mt-2" th:if="${attempt.reviewed}">
        <i class="bi bi-award"></i> Download Certificate
    </a>
</div>
</body>
</html>
