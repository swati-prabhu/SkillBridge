<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${test.title}">Take Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 th:text="${test.title}"></h3>
    <p class="text-muted" th:text="${test.description}"></p>

    <form th:action="@{/tests/{id}/submit(id=${test.id})}" method="post">
        <div class="card p-3 mb-3" th:each="q, iter : ${test.questions}">
            <p class="fw-bold" th:text="(${iter.index} + 1) + '. ' + ${q.questionText}"></p>
            <div class="form-check" th:each="opt : ${ {'A','B','C','D'} }">
                <input class="form-check-input" type="radio"
                       th:name="'q_' + ${q.id}" th:value="${opt}"
                       th:id="${'q' + q.id + opt}">
                <label class="form-check-label" th:for="${'q' + q.id + opt}"
                       th:text="${opt == 'A' ? q.optionA : (opt == 'B' ? q.optionB : (opt == 'C' ? q.optionC : q.optionD))}"></label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Submit Test</button>
    </form>
</div>
</body>
</html>
