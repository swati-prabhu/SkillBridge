<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mock Interview - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width:700px;">
    <h3 class="sb-section-title" th:text="${mockInterview.title}"></h3>
    <p class="sb-section-subtitle" th:text="${mockInterview.description}"></p>

    <form th:action="@{/mock-interviews/{id}/submit(id=${mockInterview.id})}" method="post">
        <div class="card p-3 mb-3" th:each="q, iter : ${mockInterview.questions}">
            <p class="fw-semibold" th:text="(${iter.index} + 1) + '. ' + ${q.questionText}"></p>
            <textarea th:name="'q_' + ${q.id}" class="form-control" rows="4" placeholder="Type your answer..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit Answers</button>
    </form>
</div>
</body>
</html>
