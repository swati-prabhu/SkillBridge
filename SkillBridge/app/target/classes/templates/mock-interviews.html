<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mock Interviews - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h3 class="sb-section-title mb-0">Mock Interviews</h3>
            <p class="sb-section-subtitle mb-0">Text-based Q&amp;A practice. Answers are auto-checked for key talking points, then reviewed by an admin.</p>
        </div>
        <a href="/mock-interviews/attempts" class="btn btn-outline-primary btn-sm">My Attempts</a>
    </div>

    <div th:if="${#lists.isEmpty(mockInterviews)}" class="sb-empty">
        <i class="bi bi-mic"></i>
        No mock interviews available yet.
    </div>

    <div class="row g-3 mt-1">
        <div class="col-md-4" th:each="m : ${mockInterviews}">
            <div class="card sb-hover p-3">
                <div class="stat-icon mb-2"><i class="bi bi-person-video3"></i></div>
                <h5 th:text="${m.title}"></h5>
                <p class="text-muted small" th:text="${m.description}"></p>
                <span class="badge bg-light text-dark border mb-2" th:text="${m.track}"></span>
                <p class="small text-muted" th:text="${#lists.size(m.questions)} + ' questions'"></p>
                <a th:href="@{/mock-interviews/{id}/take(id=${m.id})}" class="btn btn-sm btn-primary">Start</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
