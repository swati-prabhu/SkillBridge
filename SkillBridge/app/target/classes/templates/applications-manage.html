<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Applications - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/realtime :: live-updates-script}"></div>

<div class="container py-4">
    <h3 class="sb-section-title">Manage Applications</h3>
    <p class="sb-section-subtitle">Move candidates through the pipeline. The student is notified on every status change.</p>

    <div th:if="${#lists.isEmpty(applications)}" class="sb-empty">
        <i class="bi bi-inbox"></i>
        No applications yet.
    </div>

    <div class="card p-3" th:unless="${#lists.isEmpty(applications)}">
        <table class="table align-middle mb-0">
            <thead><tr><th>Student</th><th>Internship</th><th>Status</th><th>Update Status</th><th>Interview</th></tr></thead>
            <tbody>
            <tr th:each="a : ${applications}">
                <td th:text="${a.student.fullName}"></td>
                <td th:text="${a.internship.title}"></td>
                <td><span class="badge" th:classappend="'badge-status-' + ${a.status}" th:text="${a.status}"></span></td>
                <td>
                    <form th:action="@{/applications/{id}/status(id=${a.id})}" method="post" class="d-flex gap-2">
                        <select name="status" class="form-select form-select-sm">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == a.status}"></option>
                        </select>
                        <input type="number" name="offeredPackage" step="0.1" placeholder="LPA" class="form-control form-control-sm" style="max-width:90px;">
                        <button class="btn btn-sm btn-primary" type="submit">Update</button>
                    </form>
                </td>
                <td>
                    <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="modal" th:data-bs-target="'#interviewModal' + ${a.id}">
                        <i class="bi bi-camera-video"></i> Schedule
                    </button>

                    <div class="modal fade" th:id="'interviewModal' + ${a.id}" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <form th:action="@{/applications/{id}/schedule-interview(id=${a.id})}" method="post">
                                    <div class="modal-header">
                                        <h5 class="modal-title">Schedule Interview</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <div class="modal-body">
                                        <p class="small text-muted">
                                            <span th:text="${a.student.fullName}"></span> — <span th:text="${a.internship.title}"></span>
                                        </p>
                                        <div class="mb-3">
                                            <label class="form-label">Date &amp; Time</label>
                                            <input type="datetime-local" name="scheduledAt" class="form-control" required>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Mode</label>
                                            <select name="mode" class="form-select">
                                                <option value="Video Call">Video Call</option>
                                                <option value="Phone Call">Phone Call</option>
                                                <option value="In-Person">In-Person</option>
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Notes (optional)</label>
                                            <textarea name="notes" class="form-control" rows="2"></textarea>
                                        </div>
                                        <p class="small text-muted mb-0"><i class="bi bi-envelope"></i> The student will be emailed automatically.</p>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                                        <button type="submit" class="btn btn-primary">Schedule &amp; Notify</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
