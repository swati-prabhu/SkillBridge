<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Moderate Forum - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="sb-section-title">Moderate Forum</h3>
    <div class="card p-3">
        <table class="table align-middle mb-0">
            <thead><tr><th>Title</th><th>Author</th><th>Flagged</th><th>Status</th><th></th></tr></thead>
            <tbody>
            <tr th:each="p : ${posts}">
                <td><a th:href="@{/forum/{id}(id=${p.id})}" th:text="${p.title}"></a></td>
                <td th:text="${p.author.fullName}"></td>
                <td><i class="bi bi-flag-fill text-danger" th:if="${p.flagged}"></i></td>
                <td>
                    <span class="badge bg-secondary" th:if="${p.hidden}">Hidden</span>
                    <span class="badge bg-success" th:unless="${p.hidden}">Visible</span>
                </td>
                <td>
                    <form th:action="@{/forum/{id}/moderate(id=${p.id})}" method="post">
                        <input type="hidden" name="hidden" th:value="${!p.hidden}">
                        <button class="btn btn-sm" th:classappend="${p.hidden} ? 'btn-outline-success' : 'btn-outline-secondary'"
                                th:text="${p.hidden} ? 'Unhide' : 'Hide'"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
