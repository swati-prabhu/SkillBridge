<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Mock Interviews - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="sb-section-title">Mock Interviews — Admin</h3>

    <h6 class="mt-3">Pending Review (<span th:text="${#lists.size(pendingReview)}"></span>)</h6>
    <div th:if="${#lists.isEmpty(pendingReview)}" class="sb-empty">
        <i class="bi bi-check2-circle"></i>
        Nothing waiting for review.
    </div>
    <div class="card p-3 mb-4" th:unless="${#lists.isEmpty(pendingReview)}">
        <div th:each="a : ${pendingReview}" class="border-bottom py-3">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <strong th:text="${a.student.fullName}"></strong> — <span th:text="${a.mockInterview.title}"></span>
                    <p class="small text-muted mb-0">Preliminary auto-score: <span th:text="${a.overallScore}"></span>%</p>
                </div>
            </div>
            <div th:each="r, iter : ${a.responses}" class="mt-2 small">
                <strong th:text="(${iter.index} + 1) + '. ' + ${r.question.questionText}"></strong>
                <p class="text-muted mb-0" th:text="${r.answerText}"></p>
            </div>
            <form th:action="@{/mock-interviews/attempts/{id}/review(id=${a.id})}" method="post" class="d-flex gap-2 mt-2">
                <input type="number" name="score" min="0" max="100" class="form-control form-control-sm" style="max-width:100px;" placeholder="Score %" required>
                <input type="text" name="feedback" class="form-control form-control-sm" placeholder="Feedback for the student" required>
                <button class="btn btn-sm btn-primary" type="submit">Submit Review</button>
            </form>
        </div>
    </div>

    <h6>All Mock Interviews</h6>
    <div class="card p-3">
        <table class="table align-middle mb-0">
            <thead><tr><th>Title</th><th>Track</th><th>Questions</th></tr></thead>
            <tbody>
            <tr th:each="m : ${mockInterviews}">
                <td th:text="${m.title}"></td>
                <td th:text="${m.track}"></td>
                <td th:text="${#lists.size(m.questions)}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
