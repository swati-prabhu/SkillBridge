<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recruiter Profile - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width:700px;">
    <div class="card p-4 mb-3">
        <h4 th:text="${user.fullName}"></h4>
        <p class="text-muted mb-1" th:text="${user.email}"></p>
        <span class="badge bg-success" th:if="${user.recruiterVerified}">Verified Recruiter</span>
        <span class="badge bg-warning text-dark" th:unless="${user.recruiterVerified}">Pending Verification</span>
    </div>

    <div class="card p-4">
        <h5 class="mb-3">Company &amp; Profile Details</h5>
        <form th:action="@{/recruiter/profile}" method="post">
            <div class="mb-3">
                <label class="form-label">Your Designation</label>
                <input type="text" name="designation" class="form-control" th:value="${user.designation}" placeholder="e.g. Talent Acquisition Lead">
            </div>
            <div class="mb-3">
                <label class="form-label">Company Name</label>
                <input type="text" class="form-control" disabled th:value="${company != null ? company.name : ''}">
            </div>
            <div class="mb-3">
                <label class="form-label">Company Website</label>
                <input type="text" name="companyWebsite" class="form-control" th:value="${company != null ? company.website : ''}">
            </div>
            <div class="mb-3">
                <label class="form-label">Company Description</label>
                <textarea name="companyDescription" class="form-control" rows="3" th:text="${company != null ? company.description : ''}"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>

    <div class="card p-4 mt-3" th:if="${ratingSummary != null and ratingSummary.totalRatings > 0}">
        <h5 class="mb-2"><i class="bi bi-star-fill text-warning"></i> Anonymous Student Ratings</h5>
        <div class="row text-center g-2">
            <div class="col-4"><strong th:text="${ratingSummary.avgDifficulty} + '/5'"></strong><br><span class="small text-muted">Difficulty</span></div>
            <div class="col-4"><strong th:text="${ratingSummary.avgCommunication} + '/5'"></strong><br><span class="small text-muted">Communication</span></div>
            <div class="col-4"><strong th:text="${ratingSummary.avgProcess} + '/5'"></strong><br><span class="small text-muted">Process</span></div>
        </div>
        <hr>
        <div th:each="c : ${ratingSummary.comments}" class="border-bottom py-2 small">
            <i class="bi bi-quote text-muted"></i> <span th:text="${c}"></span>
        </div>
    </div>
</div>
</body>
</html>
