<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="sb-section-title">Welcome back, <span th:text="${user.fullName}"></span></h3>
    <p class="sb-section-subtitle">Admin control center</p>

    <div class="row g-3">
        <div class="col-md-3">
            <div class="card stat-card sb-hover">
                <div class="stat-icon"><i class="bi bi-briefcase"></i></div>
                <div class="value" th:text="${totalInternships}">0</div>
                <div class="label">Total Internships</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card sb-hover">
                <div class="stat-icon"><i class="bi bi-send-check"></i></div>
                <div class="value" th:text="${totalApplications}">0</div>
                <div class="label">Total Applications</div>
            </div>
        </div>
        <div class="col-md-3">
            <a href="/admin/drives" class="text-decoration-none">
                <div class="card stat-card sb-hover">
                    <div class="stat-icon"><i class="bi bi-calendar-event"></i></div>
                    <div class="value" th:text="${totalDrives}">0</div>
                    <div class="label">Placement Drives</div>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a href="/analytics" class="text-decoration-none">
                <div class="card stat-card sb-hover">
                    <div class="stat-icon"><i class="bi bi-graph-up"></i></div>
                    <div class="value" style="font-size:1.1rem;">View Analytics</div>
                    <div class="label">Live portal metrics</div>
                </div>
            </a>
        </div>
    </div>

    <div class="mt-4 d-flex gap-2 flex-wrap">
        <a href="/internships/new" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Post New Internship</a>
        <a href="/applications/manage" class="btn btn-outline-primary"><i class="bi bi-kanban"></i> Manage Applications</a>
        <a href="/admin/drives" class="btn btn-outline-primary"><i class="bi bi-calendar-event"></i> Placement Drives</a>
        <a href="/admin/audit-log" class="btn btn-outline-primary"><i class="bi bi-list-check"></i> Audit Log</a>
        <a href="/roadmaps" class="btn btn-outline-primary"><i class="bi bi-map"></i> View Roadmaps</a>
    </div>
</div>
</body>
</html>
