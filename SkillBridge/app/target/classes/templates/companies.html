<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Companies - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="sb-section-title">Companies</h3>
    <p class="sb-section-subtitle">Browse companies and see anonymous student ratings before you apply.</p>

    <div class="row g-3">
        <div class="col-md-4" th:each="c : ${companies}">
            <a th:href="@{/companies/{id}(id=${c.id})}" class="text-decoration-none">
                <div class="card sb-hover p-3 h-100">
                    <div class="d-flex justify-content-between">
                        <h5 th:text="${c.name}"></h5>
                        <span class="badge bg-success" th:if="${c.verified}"><i class="bi bi-patch-check"></i></span>
                    </div>
                    <p class="text-muted small" th:text="${c.industry}"></p>
                    <p class="small text-muted" th:text="${#lists.size(c.internships)} + ' internship(s) posted'"></p>
                </div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
