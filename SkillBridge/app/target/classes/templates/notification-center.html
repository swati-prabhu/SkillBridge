<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width:700px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="sb-section-title mb-0">Notifications</h3>
        <form th:action="@{/notifications/mark-read}" method="post">
            <button class="btn btn-outline-primary btn-sm" type="submit">Mark all read</button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(notifications)}" class="sb-empty">
        <i class="bi bi-bell"></i>
        No notifications yet.
    </div>

    <div class="card mb-2" th:each="n : ${notifications}" th:classappend="${!n.read} ? 'border-primary' : ''">
        <div class="p-3 d-flex justify-content-between align-items-start gap-2">
            <a th:href="${n.link != null ? n.link : '#'}" class="text-decoration-none text-dark flex-grow-1">
                <p class="mb-1" th:text="${n.message}"></p>
                <span class="small text-muted" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, hh:mm a')}"></span>
            </a>
            <div class="d-flex gap-1">
                <form th:action="@{/notifications/{id}/mark-read(id=${n.id})}" method="post" th:if="${!n.read}">
                    <button class="btn btn-sm btn-outline-secondary" title="Mark read"><i class="bi bi-check2"></i></button>
                </form>
                <form th:action="@{/notifications/{id}/delete(id=${n.id})}" method="post">
                    <button class="btn btn-sm btn-outline-danger" title="Delete"><i class="bi bi-trash"></i></button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
