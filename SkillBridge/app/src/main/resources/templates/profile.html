<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width:700px;">
    <div class="card p-4 mb-3">
        <div class="d-flex align-items-center gap-3">
            <div class="roadmap-icon" style="width:60px;height:60px;font-size:1.6rem;"><i class="bi bi-person"></i></div>
            <div>
                <h4 class="mb-0" th:text="${user.fullName}"></h4>
                <p class="text-muted mb-1" th:text="${user.email}"></p>
                <span class="badge bg-secondary" th:text="${user.role}"></span>
            </div>
        </div>
    </div>

    <div class="card p-4 mb-3">
        <h5><i class="bi bi-stars"></i> Skills</h5>
        <p class="text-muted small">Used to power internship recommendations.</p>
        <form th:action="@{/profile/skills}" method="post" class="d-flex gap-2">
            <input type="text" name="skills" class="form-control" th:value="${user.skills}" placeholder="e.g. Java, SQL, React">
            <button class="btn btn-primary" type="submit">Save</button>
        </form>
    </div>

    <div class="card p-4">
        <h5><i class="bi bi-file-earmark-text"></i> Resume</h5>
        <p th:if="${user.resumePath}" class="text-success"><i class="bi bi-check-circle"></i> Resume uploaded</p>
        <p th:unless="${user.resumePath}" class="text-muted">No resume uploaded yet.</p>
        <form th:action="@{/profile/resume}" method="post" enctype="multipart/form-data" class="d-flex gap-2">
            <input type="file" name="resume" class="form-control" accept=".pdf,.doc,.docx" required>
            <button class="btn btn-primary" type="submit">Upload</button>
        </form>
    </div>
</div>
</body>
</html>
