<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Mock Interview Attempts - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="sb-section-title">My Mock Interview Attempts</h3>

    <div th:if="${#lists.isEmpty(attempts)}" class="sb-empty">
        <i class="bi bi-mic"></i>
        You haven't attempted any mock interviews yet.
    </div>

    <div class="card p-3" th:unless="${#lists.isEmpty(attempts)}">
        <table class="table align-middle mb-0">
            <thead><tr><th>Mock Interview</th><th>Submitted</th><th>Status</th><th></th></tr></thead>
            <tbody>
            <tr th:each="a : ${attempts}">
                <td th:text="${a.mockInterview.title}"></td>
                <td class="small text-muted" th:text="${#temporals.format(a.submittedAt, 'dd MMM yyyy')}"></td>
                <td>
                    <span class="badge bg-success" th:if="${a.reviewed}">Reviewed — <span th:text="${a.overallScore}"></span>%</span>
                    <span class="badge bg-warning text-dark" th:unless="${a.reviewed}">Preliminary — <span th:text="${a.overallScore}"></span>%</span>
                </td>
                <td>
                    <a th:href="@{/mock-interviews/attempts/{id}(id=${a.id})}" class="btn btn-sm btn-outline-primary">View</a>
                    <a th:href="@{/certificates/mock-interview/{id}(id=${a.id})}" class="btn btn-sm btn-outline-success" th:if="${a.reviewed}"><i class="bi bi-award"></i></a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
