<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Analytics - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="sb-section-title">Analytics Dashboard</h3>
    <p class="sb-section-subtitle">Live metrics, also queryable by AI agents via the MCP server.</p>

    <div class="row g-3">
        <div class="col-md-3">
            <div class="card stat-card sb-hover">
                <div class="stat-icon"><i class="bi bi-mortarboard"></i></div>
                <div class="value" th:text="${summary.totalStudents}"></div>
                <div class="label">Students</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card sb-hover">
                <div class="stat-icon"><i class="bi bi-briefcase"></i></div>
                <div class="value" th:text="${summary.totalInternships}"></div>
                <div class="label">Internships</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card sb-hover">
                <div class="stat-icon"><i class="bi bi-send-check"></i></div>
                <div class="value" th:text="${summary.totalApplications}"></div>
                <div class="label">Applications</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card sb-hover">
                <div class="stat-icon"><i class="bi bi-graph-up-arrow"></i></div>
                <div class="value" th:text="${summary.averageAptitudeScorePercent} + '%'"></div>
                <div class="label">Avg. Aptitude Score</div>
            </div>
        </div>
    </div>

    <div class="row g-3 mt-1">
        <div class="col-md-4">
            <div class="card stat-card sb-hover">
                <div class="stat-icon"><i class="bi bi-camera-video"></i></div>
                <div class="value" th:text="${summary.totalInterviews}"></div>
                <div class="label">Interviews Scheduled</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card sb-hover">
                <div class="stat-icon"><i class="bi bi-calendar-event"></i></div>
                <div class="value" th:text="${summary.totalPlacementDrives}"></div>
                <div class="label">Placement Drives</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card sb-hover">
                <div class="stat-icon"><i class="bi bi-file-earmark-person"></i></div>
                <div class="value" th:text="${summary.averageResumeScore} + '%'"></div>
                <div class="label">Avg. Resume Score</div>
            </div>
        </div>
    </div>

    <div class="card p-4 mt-4">
        <h5>Applications by Status</h5>
        <canvas id="statusChart" height="100"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
