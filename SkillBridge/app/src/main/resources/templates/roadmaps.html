<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Career Roadmaps - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="sb-section-title">Career Roadmaps</h3>
    <p class="sb-section-subtitle">Follow a guided, step-by-step path toward internship-readiness. Check off steps as you complete them.</p>

    <div th:if="${#lists.isEmpty(roadmaps)}" class="sb-empty">
        <i class="bi bi-map"></i>
        No roadmaps available yet.
    </div>

    <div class="row g-3">
        <div class="col-md-4" th:each="r : ${roadmaps}">
            <a th:href="@{/roadmaps/{id}(id=${r.id})}" class="text-decoration-none">
                <div class="card sb-hover p-3 h-100" th:classappend="${r.id == recommendedRoadmapId} ? 'border-primary' : ''">
                    <span class="badge bg-primary mb-2 align-self-start" th:if="${r.id == recommendedRoadmapId}">
                        <i class="bi bi-stars"></i> Recommended for you
                    </span>
                    <div class="d-flex align-items-center gap-3 mb-2">
                        <div class="roadmap-icon"><i th:class="'bi ' + ${r.icon}"></i></div>
                        <div>
                            <h6 class="mb-0 text-dark" th:text="${r.title}"></h6>
                            <span class="badge bg-light text-dark border" th:text="${r.track}"></span>
                        </div>
                    </div>
                    <p class="text-muted small" th:text="${r.description}"></p>
                    <div class="roadmap-progress mb-1">
                        <div class="roadmap-progress-bar" th:style="'width:' + ${percentByRoadmap.get(r.id)} + '%'"></div>
                    </div>
                    <span class="small text-muted" th:text="${percentByRoadmap.get(r.id)} + '% complete · ' + ${#lists.size(r.steps)} + ' steps'"></span>
                </div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
