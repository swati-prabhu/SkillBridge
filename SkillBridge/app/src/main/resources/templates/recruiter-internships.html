<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Internships - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="sb-section-title mb-0">My Internships</h3>
        <a href="/internships/new" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Post Internship</a>
    </div>

    <div th:if="${#lists.isEmpty(internships)}" class="sb-empty">
        <i class="bi bi-briefcase"></i>
        You haven't posted any internships yet.
    </div>

    <div class="row g-3">
        <div class="col-md-4" th:each="i : ${internships}">
            <div class="card sb-hover p-3 h-100 d-flex flex-column">
                <h5 th:text="${i.title}"></h5>
                <p class="small mb-1"><i class="bi bi-geo-alt"></i> <span th:text="${i.location}"></span></p>
                <p class="small text-muted flex-grow-1" th:text="${i.requiredSkills}"></p>
                <div class="d-flex gap-2 mt-2">
                    <a th:href="@{/recruiter/internships/{id}/applicants(id=${i.id})}" class="btn btn-sm btn-primary flex-fill">Applicants</a>
                    <a th:href="@{/internships/{id}/edit(id=${i.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
