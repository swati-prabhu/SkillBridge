<div xmlns:th="http://www.thymeleaf.org" th:fragment="widget" sec:authorize="hasAuthority('ROLE_STUDENT')" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <button id="aiAssistantToggle" class="btn btn-primary rounded-circle shadow"
            style="position:fixed; bottom:24px; right:24px; width:56px; height:56px; z-index:1050;">
        <i class="bi bi-robot fs-5"></i>
    </button>

    <div id="aiAssistantPanel" class="card shadow"
         style="position:fixed; bottom:90px; right:24px; width:340px; max-height:460px; z-index:1050; display:none;">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-2">
            <span><i class="bi bi-robot"></i> Placement Assistant</span>
            <button class="btn-close btn-close-white" onclick="document.getElementById('aiAssistantPanel').style.display='none'"></button>
        </div>
        <div id="aiAssistantMessages" class="p-2" style="height:300px; overflow-y:auto; font-size:0.85rem;">
            <div class="alert alert-light py-2 small mb-2">
                Hi! I can help with internship recommendations, resume feedback, your application status, roadmap suggestions,
                interview schedule, or aptitude scores.
                <br><span class="text-muted" style="font-size:0.72rem;">Rule-based assistant — not a live LLM.</span>
            </div>
        </div>
        <div class="card-footer p-2">
            <form id="aiAssistantForm" class="d-flex gap-1">
                <input type="text" id="aiAssistantInput" class="form-control form-control-sm" placeholder="Ask something..." autocomplete="off">
                <button class="btn btn-sm btn-primary" type="submit"><i class="bi bi-send"></i></button>
            </form>
        </div>
    </div>

    <script th:inline="none">
        document.getElementById('aiAssistantToggle')?.addEventListener('click', () => {
            const panel = document.getElementById('aiAssistantPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });

        document.getElementById('aiAssistantForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('aiAssistantInput');
            const messages = document.getElementById('aiAssistantMessages');
            const text = input.value.trim();
            if (!text) return;

            messages.innerHTML += `<div class="text-end mb-2"><span class="badge bg-primary">${escapeHtml(text)}</span></div>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            try {
                const res = await fetch('/api/assistant/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                });
                const data = await res.json();
                messages.innerHTML += `<div class="mb-2"><div class="bg-light rounded p-2" style="white-space:pre-line;">${escapeHtml(data.reply)}</div></div>`;
            } catch (err) {
                messages.innerHTML += `<div class="mb-2 text-danger small">Something went wrong. Try again.</div>`;
            }
            messages.scrollTop = messages.scrollHeight;
        });

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</div>
