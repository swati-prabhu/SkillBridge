<div xmlns:th="http://www.thymeleaf.org" th:fragment="live-updates-script">
    <div id="liveUpdateBanner" class="alert alert-info py-2 px-3 mb-3" style="display:none; position:sticky; top:70px; z-index:10;">
        <i class="bi bi-broadcast"></i> <span id="liveUpdateText"></span>
        <a href="javascript:location.reload()" class="ms-2">Refresh</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script th:inline="none">
        (function () {
            const socket = new SockJS('/ws');
            const client = new StompJs.Client({ webSocketFactory: () => socket, reconnectDelay: 5000 });

            client.onConnect = () => {
                client.subscribe('/topic/applications', (frame) => {
                    const event = JSON.parse(frame.body);
                    const banner = document.getElementById('liveUpdateBanner');
                    const text = document.getElementById('liveUpdateText');
                    if (banner && text) {
                        text.textContent = event.message;
                        banner.style.display = 'block';
                    }
                });
            };
            client.activate();
        })();
    </script>
</div>
