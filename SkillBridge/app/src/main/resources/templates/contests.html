<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Coding Contests - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="sb-section-title">Coding Contests</h3>
    <p class="sb-section-subtitle">MCQ rounds plus external coding problem links. Leaderboard ranks by score, then submission speed.</p>

    <div th:if="${#lists.isEmpty(contests)}" class="sb-empty">
        <i class="bi bi-trophy"></i>
        No contests scheduled right now.
    </div>

    <div class="row g-3">
        <div class="col-md-4" th:each="c : ${contests}">
            <div class="card sb-hover p-3 h-100 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start">
                    <h5 th:text="${c.title}"></h5>
                    <span class="badge bg-success" th:if="${c.live and !c.upcoming and !c.ended}">Live</span>
                    <span class="badge bg-warning text-dark" th:if="${c.upcoming}">Upcoming</span>
                    <span class="badge bg-secondary" th:if="${c.ended}">Ended</span>
                </div>
                <p class="text-muted small" th:text="${c.description}"></p>
                <p class="small text-muted mb-1" th:if="${c.startsAt}">
                    <i class="bi bi-clock"></i> <span th:text="${#temporals.format(c.startsAt, 'dd MMM, hh:mm a')}"></span>
                    – <span th:text="${#temporals.format(c.endsAt, 'dd MMM, hh:mm a')}"></span>
                </p>
                <div class="mt-2" th:if="${c.codingLinks != null and !c.codingLinks.isEmpty()}">
                    <p class="small fw-semibold mb-1">Coding Problems:</p>
                    <a th:each="link : ${#strings.arraySplit(c.codingLinks, ',')}" th:href="${link.trim()}" target="_blank" class="d-block small">
                        <i class="bi bi-box-arrow-up-right"></i> <span th:text="${link.trim()}"></span>
                    </a>
                </div>
                <div class="mt-auto pt-2 d-flex gap-2">
                    <a th:href="@{/tests/{id}/take(id=${c.id})}" class="btn btn-sm btn-primary flex-fill" th:unless="${c.ended}">Take MCQ Round</a>
                    <a th:href="@{/contests/{id}/leaderboard(id=${c.id})}" class="btn btn-sm btn-outline-secondary">Leaderboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
