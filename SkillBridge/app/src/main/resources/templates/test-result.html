<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test Result - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="card p-4 text-center">
        <h3>Test Completed 🎉</h3>
        <p class="display-6 mt-3" th:text="${result.score} + ' / ' + ${result.totalQuestions}"></p>
        <p class="text-muted">Your score has been recorded.</p>
        <a href="/tests" class="btn btn-primary mt-2">Back to Tests</a>
    </div>
</div>
</body>
</html>
