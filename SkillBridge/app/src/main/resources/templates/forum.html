<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Discussion Forum - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="sb-section-title mb-0">Discussion Forum</h3>
        <a href="/forum/new" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> New Post</a>
    </div>

    <div class="mb-3 d-flex gap-2 flex-wrap">
        <a href="/forum" class="btn btn-sm" th:classappend="${selectedCategory == null} ? 'btn-primary' : 'btn-outline-secondary'">All</a>
        <a th:each="c : ${categories}" th:href="@{/forum(category=${c})}" class="btn btn-sm"
           th:classappend="${selectedCategory == c} ? 'btn-primary' : 'btn-outline-secondary'" th:text="${c}"></a>
    </div>

    <div th:if="${#lists.isEmpty(posts)}" class="sb-empty">
        <i class="bi bi-chat-dots"></i>
        No posts yet — start the conversation.
    </div>

    <div class="card mb-2" th:each="p : ${posts}">
        <a th:href="@{/forum/{id}(id=${p.id})}" class="text-decoration-none text-dark">
            <div class="p-3">
                <div class="d-flex justify-content-between">
                    <h6 class="mb-1" th:text="${p.title}"></h6>
                    <span class="badge bg-light text-dark border" th:text="${p.category}"></span>
                </div>
                <p class="text-muted small mb-1" th:text="${#strings.abbreviate(p.body, 150)}"></p>
                <p class="small text-muted mb-0">
                    by <span th:text="${p.author.fullName}"></span> ·
                    <span th:text="${#temporals.format(p.createdAt, 'dd MMM yyyy')}"></span> ·
                    <span th:text="${#lists.size(p.comments)}"></span> comment(s)
                </p>
            </div>
        </a>
    </div>
</div>
</body>
</html>
