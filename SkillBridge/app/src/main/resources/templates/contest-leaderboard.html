<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <a href="/contests" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left"></i> All contests</a>
    <h3 class="sb-section-title mt-2" th:text="'Leaderboard: ' + ${contest.title}"></h3>

    <div th:if="${#lists.isEmpty(results)}" class="sb-empty">
        <i class="bi bi-trophy"></i>
        No submissions yet — be the first!
    </div>

    <div class="card p-3" th:unless="${#lists.isEmpty(results)}">
        <table class="table align-middle mb-0">
            <thead><tr><th>Rank</th><th>Student</th><th>Score</th><th>Submitted</th></tr></thead>
            <tbody>
            <tr th:each="r, iter : ${results}" th:classappend="${r.student.id == currentUserId} ? 'table-primary' : ''">
                <td>
                    <span th:if="${iter.index == 0}">🥇</span>
                    <span th:if="${iter.index == 1}">🥈</span>
                    <span th:if="${iter.index == 2}">🥉</span>
                    <span th:unless="${iter.index < 3}" th:text="${iter.index + 1}"></span>
                </td>
                <td th:text="${r.student.fullName}"></td>
                <td th:text="${r.score} + '/' + ${r.totalQuestions}"></td>
                <td class="small text-muted" th:text="${#temporals.format(r.takenAt, 'dd MMM, hh:mm a')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
