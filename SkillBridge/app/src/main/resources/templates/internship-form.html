<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Post Internship - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="card p-4">
        <h4 class="mb-3">Post an Internship</h4>
        <form th:action="@{/internships}" th:object="${internship}" method="post" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" th:field="*{title}" class="form-control" required>
            </div>
            <div class="mb-3" sec:authorize="hasAuthority('ROLE_ADMIN')">
                <label class="form-label">Company</label>
                <input type="text" th:field="*{company}" class="form-control" required>
            </div>
            <div class="mb-3" sec:authorize="hasAuthority('ROLE_RECRUITER')">
                <label class="form-label">Company</label>
                <input type="text" class="form-control" disabled th:value="${internship.company}" placeholder="Posted under your recruiter profile's company">
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" th:field="*{location}" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Stipend</label>
                    <input type="text" th:field="*{stipend}" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Duration</label>
                    <input type="text" th:field="*{duration}" class="form-control">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Required Skills (comma-separated)</label>
                <input type="text" th:field="*{requiredSkills}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <input type="text" th:field="*{category}" class="form-control" placeholder="e.g. Engineering, Design, Data">
            </div>
            <button type="submit" class="btn btn-primary">Save Internship</button>
        </form>
    </div>
</div>
</body>
</html>
