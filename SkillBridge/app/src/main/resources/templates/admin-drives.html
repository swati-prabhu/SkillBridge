<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Placement Drives - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3 class="sb-section-title mb-0">Placement Drives</h3>
            <p class="sb-section-subtitle mb-0">Organize internships under recruiting drives/events.</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newDriveModal"><i class="bi bi-plus-lg"></i> New Drive</button>
    </div>

    <div th:if="${#lists.isEmpty(drives)}" class="sb-empty">
        <i class="bi bi-calendar-event"></i>
        No placement drives yet.
    </div>

    <div class="row g-3">
        <div class="col-md-4" th:each="d : ${drives}">
            <div class="card p-3 h-100">
                <div class="d-flex justify-content-between align-items-start">
                    <h6 th:text="${d.name}"></h6>
                    <span class="badge" th:classappend="${d.active} ? 'bg-success' : 'bg-secondary'" th:text="${d.active} ? 'Active' : 'Inactive'"></span>
                </div>
                <p class="text-muted small mb-1" th:text="${d.company}"></p>
                <p class="small mb-2" th:text="${d.description}"></p>
                <p class="small text-muted mb-2"><i class="bi bi-calendar3"></i> <span th:text="${#temporals.format(d.driveDate, 'dd MMM yyyy')}"></span></p>
                <p class="small text-muted mb-3"><i class="bi bi-briefcase"></i> <span th:text="${#lists.size(d.internships)}"></span> linked internships</p>
                <form th:action="@{/admin/drives/{id}/toggle(id=${d.id})}" method="post">
                    <input type="hidden" name="active" th:value="${!d.active}">
                    <button type="submit" class="btn btn-sm w-100" th:classappend="${d.active} ? 'btn-outline-secondary' : 'btn-outline-success'">
                        <span th:text="${d.active} ? 'Deactivate' : 'Activate'"></span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="newDriveModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/drives}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">New Placement Drive</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Drive Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Company</label>
                        <input type="text" name="company" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Drive Date</label>
                        <input type="date" name="driveDate" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Drive</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
