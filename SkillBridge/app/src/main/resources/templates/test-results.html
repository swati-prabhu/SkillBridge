<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Test Results - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3>My Test Results</h3>
    <table class="table mt-3">
        <thead><tr><th>Test</th><th>Score</th><th>Percentage</th><th>Date</th></tr></thead>
        <tbody>
        <tr th:each="r : ${results}">
            <td th:text="${r.test.title}"></td>
            <td th:text="${r.score} + ' / ' + ${r.totalQuestions}"></td>
            <td th:text="${#numbers.formatDecimal((r.score * 100.0) / r.totalQuestions, 1, 1)} + '%'"></td>
            <td th:text="${#temporals.format(r.takenAt, 'dd MMM yyyy')}"></td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(results)}" class="text-muted">You haven't taken any tests yet.</p>
</div>
</body>
</html>
