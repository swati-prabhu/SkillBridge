<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Internships - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3 class="sb-section-title mb-0">Internships</h3>
            <p class="sb-section-subtitle mb-0">Browse open opportunities</p>
        </div>
        <a sec:authorize="hasAuthority('ROLE_ADMIN')" href="/internships/new" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Post Internship</a>
    </div>

    <form method="get" class="mb-4 d-flex gap-2">
        <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by title, company, or location">
        <select name="category" class="form-select" style="max-width:220px;" onchange="this.form.submit()">
            <option value="">All Categories</option>
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option>
        </select>
        <button class="btn btn-outline-primary" type="submit"><i class="bi bi-search"></i> Search</button>
    </form>

    <div th:if="${#lists.isEmpty(internships)}" class="sb-empty">
        <i class="bi bi-search"></i>
        No internships match your search.
    </div>

    <div class="row g-3">
        <div class="col-md-4" th:each="i : ${internships}">
            <div class="card sb-hover p-3 h-100 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start">
                    <span class="badge bg-light text-dark border" th:text="${i.category}"></span>
                </div>
                <h5 class="mt-2" th:text="${i.title}"></h5>
                <p class="text-muted mb-1" th:text="${i.company}"></p>
                <p class="small mb-1"><i class="bi bi-geo-alt"></i> <span th:text="${i.location}"></span></p>
                <p class="small mb-1"><i class="bi bi-cash-coin"></i> <span th:text="${i.stipend}"></span> &middot; <i class="bi bi-clock"></i> <span th:text="${i.duration}"></span></p>
                <p class="small text-muted flex-grow-1" th:text="${i.requiredSkills}"></p>
                <a th:href="@{/internships/{id}(id=${i.id})}" class="btn btn-sm btn-outline-primary mt-auto">View Details</a>
            </div>
        </div>
    </div>

    <div th:if="${totalPages > 1}" class="d-flex justify-content-center gap-2 mt-4">
        <a th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/internships(page=${p}, keyword=${keyword}, category=${category})}"
           class="btn btn-sm"
           th:classappend="${p == currentPage} ? 'btn-primary' : 'btn-outline-primary'"
           th:text="${p + 1}"></a>
    </div>
</div>
</body>
</html>
