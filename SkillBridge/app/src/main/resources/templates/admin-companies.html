<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Companies &amp; Recruiters - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="sb-section-title">Companies</h3>
    <p class="sb-section-subtitle">Verify companies and recruiter accounts before their postings are treated as trusted.</p>

    <div class="card p-3 mb-4">
        <table class="table align-middle mb-0">
            <thead><tr><th>Company</th><th>Industry</th><th>Postings</th><th>Status</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${companies}">
                <td th:text="${c.name}"></td>
                <td th:text="${c.industry}"></td>
                <td th:text="${#lists.size(c.internships)}"></td>
                <td>
                    <span class="badge bg-success" th:if="${c.verified}">Verified</span>
                    <span class="badge bg-secondary" th:unless="${c.verified}">Unverified</span>
                </td>
                <td>
                    <form th:action="@{/admin/companies/{id}/verify(id=${c.id})}" method="post">
                        <input type="hidden" name="verified" th:value="${!c.verified}">
                        <button class="btn btn-sm" th:classappend="${c.verified} ? 'btn-outline-secondary' : 'btn-outline-success'"
                                th:text="${c.verified} ? 'Unverify' : 'Verify'"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <h3 class="sb-section-title">Recruiter Accounts</h3>
    <div class="card p-3">
        <table class="table align-middle mb-0">
            <thead><tr><th>Name</th><th>Email</th><th>Company</th><th>Status</th><th></th></tr></thead>
            <tbody>
            <tr th:each="r : ${recruiters}">
                <td th:text="${r.fullName}"></td>
                <td th:text="${r.email}"></td>
                <td th:text="${r.company != null ? r.company.name : '—'}"></td>
                <td>
                    <span class="badge bg-success" th:if="${r.recruiterVerified}">Verified</span>
                    <span class="badge bg-warning text-dark" th:unless="${r.recruiterVerified}">Pending</span>
                </td>
                <td>
                    <form th:action="@{/admin/companies/recruiters/{id}/verify(id=${r.id})}" method="post">
                        <input type="hidden" name="verified" th:value="${!r.recruiterVerified}">
                        <button class="btn btn-sm" th:classappend="${r.recruiterVerified} ? 'btn-outline-secondary' : 'btn-outline-success'"
                                th:text="${r.recruiterVerified} ? 'Unverify' : 'Verify'"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
