<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Referral Requests Received - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="sb-section-title">Referral Requests Received</h3>

    <div th:if="${#lists.isEmpty(requests)}" class="sb-empty">
        <i class="bi bi-inbox"></i>
        No referral requests yet.
    </div>

    <div class="card p-3 mb-2" th:each="r : ${requests}">
        <div class="d-flex justify-content-between">
            <div>
                <strong th:text="${r.student.fullName}"></strong>
                <span th:if="${r.internship}"> — <span th:text="${r.internship.title}"></span></span>
                <p class="small text-muted mb-0" th:if="${r.message}" th:text="${r.message}"></p>
            </div>
            <span class="badge" th:classappend="${r.status.name() == 'APPROVED'} ? 'bg-success' : (${r.status.name() == 'DECLINED'} ? 'bg-danger' : 'bg-warning text-dark')" th:text="${r.status}"></span>
        </div>
        <form th:if="${r.status.name() == 'PENDING'}" th:action="@{/referrals/{id}/respond(id=${r.id})}" method="post" class="d-flex gap-2 mt-2">
            <select name="status" class="form-select form-select-sm" style="max-width:150px;">
                <option value="APPROVED">Approve</option>
                <option value="DECLINED">Decline</option>
            </select>
            <input type="text" name="responseNote" class="form-control form-control-sm" placeholder="Note (optional)">
            <button class="btn btn-sm btn-primary" type="submit">Respond</button>
        </form>
    </div>
</div>
</body>
</html>
